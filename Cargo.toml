[package]
name = "linklist"
version = "0.1.0"
edition = "2024"
description = "自托管的单二进制书签管理服务，支持 SQLite/PostgreSQL/MySQL 三种数据库"
license = "Apache-2.0"
repository = "https://github.com/jetsung/linklist"
readme = "README.md"
keywords = ["bookmark", "self-hosted", "axum", "sqlite", "postgres", "mysql"]
categories = ["web-programming"]

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "stream", "query", "form"] }
rust-embed = { version = "8", features = ["mime-guess"] }
scraper = "0.29"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "mysql", "chrono", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
tower-sessions = "0.15"
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zeroize = "1"
tower-sessions-sqlx-store = { version = "0.16", features = ["sqlite", "postgres", "mysql"] }
rpassword = "7"
pinyin = "0.11.0"
hmac = "0.13"
rsa = { version = "0.10", features = ["pkcs1v15"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

# 与 Google Rust 风格指南对齐的 lint 强制项：
# unsafe 必须带 `SAFETY:` 注释与技术论证（undocumented_unsafe_blocks）。
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
