# linklist 的 Docker Compose 定义（默认形态：SQLite）。在仓库根目录执行：
#
#   docker compose -f docker/compose.yaml up -d      # 首次会按需构建 linklist:dev
#   docker compose -f docker/compose.yaml logs -f
#   docker compose -f docker/compose.yaml down
#
# 外部数据库形态（官方镜像 + 健康检查 + 持久化卷），叠加 overlay 编排文件：
#   docker compose -f docker/compose.yaml -f docker/compose.postgres.yaml up -d
#   docker compose -f docker/compose.yaml -f docker/compose.mysql.yaml up -d
# 凭据写入 docker/.env（POSTGRES_* / MYSQL_*，见对应 overlay 文件头说明）。
#
# 容器使用默认端口 9090 与默认数据目录（工作目录 /app 下的 ./data，即
# /app/data），无需注入 LINKLIST_LISTEN / LINKLIST_DATA_DIR；其余可选配置仍
# 通过 LINKLIST_* 环境变量注入（优先级高于 config.toml，容器内无需配置文件）：
#   LINKLIST_ADMIN_PASSWORD   预置管理员口令（仅首次 setup 时生效）。可选。
#   LINKLIST_GUEST_SHARING    是否允许匿名访客查看公开共享书签。可选。
#   LINKLIST_LOG              日志级别（RUST_LOG 语法），可选。
#
# 数据落在仓库根的 data/（SQLite 数据库、快照与资产等，外部数据库形态下
# 快照/资产仍写此目录）。容器以 uid 65532 运行，目录需归属该用户：
#   mkdir -p data && chown -R 65532:65532 ./data
#
# 本地（中国网络）构建默认走 CN.Dockerfile；国际/上线构建把下面
# dockerfile 改为 docker/Dockerfile（官方源）。

name: linklist

services:
  linklist:
    image: linklist:dev
    container_name: linklist
    build:
      context: ..
      dockerfile: docker/CN.Dockerfile
    ports:
      - "9090:9090"
    volumes:
      - ../data:/app/data
    environment: {}
      # 可选：预置管理员口令（仅首次 setup 时生效），建议写入 docker/.env 或直接 export
      # LINKLIST_ADMIN_PASSWORD: "${LINKLIST_ADMIN_PASSWORD}"
      # 可选：允许匿名访客查看公开共享书签
      # LINKLIST_GUEST_SHARING: "true"
      # 日志级别（RUST_LOG 语法），可选
      # LINKLIST_LOG: info
    restart: unless-stopped
