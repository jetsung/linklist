        tag_grouping: {type: string, description: alphabetical/disabled}
        enable_favicons: {type: boolean}
        enable_preview_images: {type: boolean}
        enable_automatic_snapshots: {type: boolean}
        enable_sharing: {type: boolean}
        enable_public_sharing: {type: boolean}
        custom_css: {type: string}
        bookmark_date_display: {type: string, description: relative/absolute/hidden}
        bookmark_description_display: {type: string, description: inline/separate}
        bookmark_description_max_lines: {type: integer}
        display_url: {type: boolean}
        permanent_notes: {type: boolean}
        display_view_bookmark_action: {type: boolean}
        display_edit_bookmark_action: {type: boolean}
        display_archive_bookmark_action: {type: boolean}
        display_remove_bookmark_action: {type: boolean}
        bookmark_link_target: {type: string, description: _blank/_self}
        sticky_pagination: {type: boolean}
        collapse_side_panel: {type: boolean}
        hide_bundles: {type: boolean}
        tag_search: {type: string, description: strict/lax}
        legacy_search: {type: boolean}
        web_archive_integration: {type: string, description: disabled/enabled}
        default_mark_unread: {type: boolean}
        default_mark_shared: {type: boolean}
    SearchPreferences:
