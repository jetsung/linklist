  /api/v1/profile:
    get:
      tags: [profile]
      summary: 获取显示偏好
      description: 返回完整偏好对象（无记录时返回默认值）。
      operationId: getProfile
      responses:
        '200':
          description: 显示偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Error'
    put:
      tags: [profile]
      summary: 部分更新显示偏好
      description: 全部字段可选（partial 更新）；枚举/范围校验失败返回 400。响应为更新后的完整偏好对象。
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisplayPreferences'
      responses:
        '200':
          description: 更新后的显示偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/profile/search-preferences:
    get:
      tags: [profile]
      summary: 获取搜索偏好
      description: 默认值为 sort=added_desc、shared=off、unread=off。
      operationId: getSearchPreferences
      responses:
        '200':
          description: 搜索偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPreferences'
        '401':
          $ref: '#/components/responses/Error'
    put:
      tags: [profile]
      summary: 更新搜索偏好
      description: sort 取书签列表排序枚举；shared/unread 取 off/yes/no。
      operationId: updateSearchPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchPreferences'
      responses:
        '200':
          description: 合并保存后的搜索偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPreferences'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/profile/auto-tagging-rules:
    get:
      tags: [profile]
      summary: 获取自动打标规则
      description: 返回规则数组；无规则返回 []。
      operationId: getAutoTaggingRules
      responses:
        '200':
          description: 规则数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutoTagRule'
        '401':
          $ref: '#/components/responses/Error'
    put:
      tags: [profile]
      summary: 整体替换自动打标规则
      operationId: setAutoTaggingRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AutoTagRule'
      responses:
        '200':
          description: 替换成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
                    description: 保存后的规则数量
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/profile/feed-key:
    post:
      tags: [profile]
      summary: 获取或创建 RSS feed key
      description: 无请求体；已有 key 时幂等返回。
      operationId: getFeedKey
      responses:
        '200':
          description: feed key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedKey'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/profile/feed-key/regenerate:
    post:
      tags: [profile]
      summary: 重新生成 RSS feed key
      description: 无请求体；旧 key 立即失效。
      operationId: regenerateFeedKey
      responses:
        '200':
          description: 新 feed key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedKey'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/profile/refresh-favicons:
    post:
      tags: [profile]
      summary: 触发全量 favicon 刷新
      description: 无请求体。
      operationId: refreshFavicons
      responses:
        '200':
          description: 已触发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/global-settings:
    get:
      tags: [profile]
      summary: 公开全局设置
      description: 匿名可访问，返回对访客可见的全局设置。
      operationId: getGlobalSettings
      security: []
      responses:
        '200':
          description: 全局设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSettings'
  /api/v1/shared:
    get:
      tags: [shared]
      summary: 共享书签列表（登录用户）
      description: 支持搜索表达式与标签/共享者筛选；sort 取值同书签列表（兼容旧值 created/updated/title）。
      operationId: listShared
      parameters:
        - name: tag
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: user
          in: query
          schema:
            type: string
          description: 按共享者用户名筛选
        - name: sort
          in: query
          schema:
            type: string
            enum: [added_asc, added_desc, modified_asc, modified_desc, title_asc, title_desc]
      responses:
        '200':
          description: 共享书签分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedBookmarkList'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/shared/tags:
    get:
      tags: [shared]
      summary: 共享书签的标签计数
      description: 仅 q/user 参数生效。
      operationId: listSharedTags
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: user
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 标签计数列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameCountList'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/shared/users:
    get:
      tags: [shared]
      summary: 共享者列表
      description: 无查询参数。
      operationId: listSharedUsers
      responses:
        '200':
          description: 共享者与各自书签数
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        username:
                          type: string
                        count:
                          type: integer
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/shared/public:
    get:
      tags: [shared]
      summary: 公开共享书签（匿名）
      description: 匿名可访问；仅当共享书签的用户启用了 enable_public_sharing。对象结构同 /shared（is_editable 恒为 false）。
      operationId: listPublicShared
      security: []
      parameters:
        - name: tag
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: user
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [added_asc, added_desc, modified_asc, modified_desc, title_asc, title_desc]
      responses:
        '200':
          description: 公开共享书签分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedBookmarkList'
  /api/v1/shared/public/tags:
    get:
      tags: [shared]
      summary: 公开共享书签的标签计数
      description: 匿名可访问；仅 q 参数生效。
      operationId: listPublicSharedTags
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 标签计数列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameCountList'
  /api/v1/shared/viewer-profile:
    get:
      tags: [shared]
      summary: 访客生效资料
      description: 返回当前查看者（登录用户或匿名访客）生效的显示资料与搜索偏好。
      operationId: getViewerProfile
      responses:
        '200':
          description: 生效资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerProfile'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: 用户列表
      description: 需管理员。
      operationId: listAdminUsers
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [admin]
      summary: 创建用户
      description: 用户名去空格后非空；口令至少 8 位；用户名冲突返回 409。
      operationId: createAdminUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserIdentity'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/admin/users/{id}/deactivate:
    post:
      tags: [admin]
      summary: 停用用户
      description: 不能停用自己；停用后该用户会话与 API Token 立即失效。
      operationId: deactivateAdminUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 停用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/admin/users/{id}/activate:
    post:
      tags: [admin]
      summary: 启用用户
      operationId: activateAdminUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 启用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/admin/users/{id}/reset-password:
    post:
      tags: [admin]
      summary: 管理员重置口令
      description: 口令至少 8 位。
      operationId: resetAdminUserPassword
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/admin/data/bookmarks:
    get:
      tags: [admin]
      summary: 全站书签数据
      description: 跨用户的书签精简列表。
      operationId: listAdminBookmarks
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
          description: 默认 50，clamp 1-200
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookmarkList'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/admin/tasks:
    get:
      tags: [admin]
      summary: 抓取任务列表
      operationId: listAdminTasks
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
        - name: kind
          in: query
          schema:
            type: string
            enum: [metadata, snapshot, archive_lookup, preview]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, success, failed]
      responses:
        '200':
          description: 任务分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTaskList'
        '403':
          $ref: '#/components/responses/Error'
    delete:
      tags: [admin]
      summary: 清理任务记录
      description: 仅 kind/status 参数生效筛选。
      operationId: clearAdminTasks
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [metadata, snapshot, archive_lookup, preview]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, success, failed]
      responses:
        '200':
          description: 删除条数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedCount'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/admin/settings:
    get:
      tags: [admin]
      summary: 全局设置
      description: 返回键值对扁平对象（含默认值）。
      operationId: getAdminSettings
      responses:
        '200':
          description: 设置键值对
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettings'
        '403':
          $ref: '#/components/responses/Error'
    put:
      tags: [admin]
      summary: 更新全局设置
      description: |
        请求体为键值对对象（值均为字符串）。白名单键：
        guest_sharing（true/false/1/0）、max_upload_mb（1-1024）、
        landing_page（login/shared_bookmarks）、guest_profile_user（空串或用户 ID）、
        enable_link_prefetch（true/false）。非法键或值返回 400。响应为更新后设置。
      operationId: updateAdminSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSettings'
      responses:
        '200':
          description: 更新后的设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettings'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/admin/audit-logs:
    get:
      tags: [admin]
      summary: 审计日志
      operationId: listAuditLogs
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
          description: 按动作过滤（如 password_changed / token_revoked）
        - name: username
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 日志分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '403':
          $ref: '#/components/responses/Error'
    delete:
      tags: [admin]
      summary: 清理审计日志
      description: 同查询参数生效筛选。
      operationId: clearAuditLogs
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: username
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 删除条数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedCount'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/version:
    get:
      tags: [system]
      summary: 应用版本
      operationId: getVersion
      security: []
      responses:
        '200':
          description: 版本号
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
  /health:
    get:
      tags: [system]
      summary: 健康检查
      description: 匿名可访问；数据库 ping 失败返回 500 与 status=unhealthy。
      operationId: health
      security: []
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          description: 数据库不可达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /feed/{kind}:
    get:
      tags: [feed]
      summary: RSS 订阅源
      description: |
        kind 取值：all / unread / shared / public_shared。public_shared 无需 key
        （受 guest_sharing 控制）；其余 kind 需有效的 feed key（/profile/feed-key
        获取），否则 404。响应为 RSS 2.0 XML。
      operationId: getFeed
      security: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [all, unread, shared, public_shared]
        - name: key
          in: query
          schema:
            type: string
          description: feed key（all/unread/shared 必需）
        - name: limit
          in: query
          schema:
            type: integer
          description: 条数上限（默认 100，空串 = 全部，clamp 0-10000）
        - name: q
          in: query
          schema:
            type: string
          description: 搜索表达式
        - name: user
          in: query
          schema:
            type: string
          description: 按共享者用户名筛选（shared/public_shared）
        - name: unread
          in: query
          schema:
            type: string
            enum: [yes, no]
        - name: shared
          in: query
          schema:
            type: string
            enum: [yes, no]
        - name: bundle
          in: query
          schema:
            type: integer
            format: int64
          description: 本人 Bundle ID
      responses:
        '200':
          description: RSS 2.0 XML
          content:
            application/rss+xml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'
  /feeds/shared:
    get:
      tags: [feed]
      summary: 公开共享 RSS（匿名）
      description: 等价 /feed/public_shared；受 guest_sharing 控制。
      operationId: getPublicSharedFeed
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
        - name: user
          in: query
          schema:
            type: string
        - name: unread
          in: query
          schema:
            type: string
            enum: [yes, no]
        - name: shared
          in: query
          schema:
            type: string
            enum: [yes, no]
      responses:
        '200':
          description: RSS 2.0 XML
          content:
            application/rss+xml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'
  /feeds/{key}/{kind}:
    get:
      tags: [feed]
      summary: RSS 订阅源（key 在路径中）
      description: key 为有效 feed key；kind 取值同 /feed/{kind}。
      operationId: getFeedByKey
      security: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [all, unread, shared, public_shared]
        - name: limit
          in: query
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
        - name: user
          in: query
          schema:
            type: string
        - name: unread
          in: query
          schema:
            type: string
            enum: [yes, no]
        - name: shared
          in: query
          schema:
            type: string
            enum: [yes, no]
      responses:
        '200':
          description: RSS 2.0 XML
          content:
            application/rss+xml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'
  /opensearch.xml:
    get:
      tags: [system]
      summary: OpenSearch 描述文档
      description: 匿名可访问；搜索模板 {base}/bookmarks?client=opensearch&q={searchTerms}。
      operationId: getOpensearch
      security: []
      responses:
        '200':
          description: OpenSearch XML
          content:
            application/opensearchdescription+xml:
              schema:
                type: string
  /manifest.json:
    get:
      tags: [system]
      summary: PWA manifest
      description: 匿名可访问；背景色随当前用户主题（dark → #161822，否则 #ffffff）。
      operationId: getManifest
      security: []
      responses:
        '200':
          description: Web App Manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  short_name:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  start_url:
                    type: string
                  display:
                    type: string
                  scope:
                    type: string
                  theme_color:
                    type: string
                  background_color:
                    type: string
                  icons:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  shortcuts:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /custom_css:
    get:
      tags: [system]
      summary: 自定义 CSS
      description: 返回当前生效资料的 custom_css 文本。
      operationId: getCustomCss
      responses:
        '200':
          description: CSS 文本
          content:
            text/css:
              schema:
                type: string
