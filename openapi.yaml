      responses:
        '200':
          description: 逐项结果汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/{id}/capture:
    post:
      tags: [capture]
      summary: 触发页面抓取任务
      description: kind 缺省为 metadata；取值 metadata（抓标题/描述）、snapshot（HTML 快照，需 enable_snapshots）、archive_lookup（Internet Archive 查询）。后台任务被禁用或快照未启用时返回 400。
      operationId: triggerCapture
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureRequest'
      responses:
        '202':
          description: 任务已入队
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureTriggered'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/{id}/capture-tasks:
    get:
      tags: [capture]
      summary: 书签抓取任务列表
      operationId: listCaptureTasks
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
      responses:
        '200':
          description: 任务列表（仅本人书签；无任务返回空数组）
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/CaptureTask'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/capture-tasks/{task_id}/retry:
    post:
      tags: [capture]
      summary: 重试失败的抓取任务
      description: 仅 status=failed 的任务可重试（否则 400）；重试后状态置回 pending、attempts 归零。
      operationId: retryCaptureTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 已重置待重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/{id}/snapshot:
    get:
      tags: [capture]
      summary: 获取 HTML 快照
      description: '流式返回 singlefile 快照（Content-Disposition: inline + CSP sandbox）；无快照 404。'
      operationId: getSnapshot
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
      responses:
        '200':
          description: 快照 HTML
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/{id}/singlefile:
    post:
      tags: [capture]
      summary: 上传浏览器端 singlefile 快照
      description: |
        请求体为 single-file 生成的完整 HTML 原始字节（非 multipart），最大 50 MiB；
        支持 gzip（Content-Encoding: gzip 或 1f 8b 魔数自动解压）；
        需启用资产上传（disable_asset_upload 关闭时 403）。
      operationId: uploadSinglefile
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
      requestBody:
        required: true
        content:
          text/html:
            schema:
              type: string
              format: binary
          application/gzip:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinglefileUploadResult'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/{id}/assets:
    post:
      tags: [assets]
      summary: 上传资产
      description: |
        multipart 表单，文件字段名为 file。类型白名单：image/png、image/jpeg、
        image/gif、image/webp、image/svg+xml、application/pdf、application/zip、
        text/plain、text/html；单文件上限 10 MiB。需启用资产上传（否则 403）。
      operationId: uploadAsset
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetUploaded'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      tags: [assets]
      summary: 资产列表
      operationId: listAssets
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
      responses:
        '200':
          description: 资产列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/{id}/assets/{aid}:
    get:
      tags: [assets]
      summary: 下载资产
      description: '以原始 Content-Type 流式返回（Content-Disposition: inline）。'
      operationId: downloadAsset
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 资产文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [assets]
      summary: 删除资产
      operationId: deleteAsset
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '204':
          description: 删除成功
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/{id}/assets/{aid}/read:
    get:
      tags: [assets]
      summary: 在线阅读 HTML 资产
      description: 返回阅读器包装页（CSP sandbox）；非 text/html 资产返回 400。
      operationId: readAsset
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: HTML 阅读页
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/bundles:
    get:
      tags: [bundles]
      summary: Bundle 列表
      description: 按 sort_order、created_at 排序。
      operationId: listBundles
      responses:
        '200':
          description: Bundle 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bundle'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [bundles]
      summary: 创建 Bundle
      operationId: createBundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBundle'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/bundles/reorder:
    post:
      tags: [bundles]
      summary: 调整 Bundle 排序
      description: 按 ids 数组顺序设置 sort_order。
      operationId: reorderBundles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkIdsRequest'
      responses:
        '200':
          description: 排序成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/bundles/preview:
    get:
      tags: [bundles]
      summary: Bundle 过滤器预览
      description: 以表单字段经 GET 参数实时构造过滤器，返回匹配书签分页（含 tags），供新建/编辑 Bundle 时预览。
      operationId: previewBundle
      parameters:
        - $ref: '#/components/parameters/PreviewPage'
        - $ref: '#/components/parameters/PreviewPerPage'
        - name: search
          in: query
          schema:
            type: string
          description: 搜索词（所有词都必须命中）
        - name: any_tags
          in: query
          schema:
            type: string
          description: 任一命中标签（逗号分隔，可带 # 前缀）
        - name: all_tags
          in: query
          schema:
            type: string
          description: 全部命中标签
        - name: excluded_tags
          in: query
          schema:
            type: string
          description: 排除标签
        - name: filter_unread
          in: query
          schema:
            type: string
            enum: [yes, no, off]
          description: 未读筛选（off/缺省 = 全部）
        - name: filter_shared
          in: query
          schema:
            type: string
            enum: [yes, no, off]
          description: 共享筛选（off/缺省 = 全部）
      responses:
        '200':
          description: 预览分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkPreviewList'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/bundles/preview/tags:
    get:
      tags: [bundles]
      summary: Bundle 过滤器预览的标签计数
      description: 查询参数同 /bundles/preview，返回匹配书签使用的标签。
      operationId: previewBundleTags
      parameters:
        - $ref: '#/components/parameters/PreviewPage'
        - $ref: '#/components/parameters/PreviewPerPage'
        - name: search
          in: query
          schema:
            type: string
        - name: any_tags
          in: query
          schema:
            type: string
        - name: all_tags
          in: query
          schema:
            type: string
        - name: excluded_tags
          in: query
          schema:
            type: string
        - name: filter_unread
          in: query
          schema:
            type: string
            enum: [yes, no, off]
        - name: filter_shared
          in: query
          schema:
            type: string
            enum: [yes, no, off]
      responses:
        '200':
          description: 标签计数列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/TagWithCount'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/bundles/{id}:
    get:
      tags: [bundles]
      summary: Bundle 详情
      operationId: getBundle
      parameters:
        - $ref: '#/components/parameters/BundleId'
      responses:
        '200':
          description: Bundle 对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [bundles]
      summary: 更新 Bundle
      description: 可选 name 与 search（或旧键 search_json）；未提供的字段不变。
      operationId: updateBundle
      parameters:
        - $ref: '#/components/parameters/BundleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBundle'
      responses:
        '200':
          description: 更新后的 Bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [bundles]
      summary: 删除 Bundle
      operationId: deleteBundle
      parameters:
        - $ref: '#/components/parameters/BundleId'
      responses:
        '204':
          description: 删除成功
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/bundles/{id}/bookmarks:
    get:
      tags: [bundles]
      summary: Bundle 匹配的书签
      description: 应用 bundle 保存的过滤器到书签查询，返回分页结果。
      operationId: bundleBookmarks
      parameters:
        - $ref: '#/components/parameters/BundleId'
      responses:
        '200':
          description: 匹配书签
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bookmark'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: id
      description: 登录会话 Cookie（tower-sessions 默认名 id）
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API Token，格式 `Token lk_...` 或 `Bearer lk_...`
  parameters:
    BookmarkId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 书签 ID
    AssetId:
      name: aid
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 资产 ID
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 用户 ID
    TagName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: 标签名（大小写不敏感）
    BundleId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Bundle ID
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
      description: 页码（默认 1）
    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
      description: 每页条数（默认取偏好或 30，上限 200）
    PreviewPage:
      name: page
      in: query
      schema:
        type: integer
      description: 页码（默认 1）
    PreviewPerPage:
      name: per_page
      in: query
      schema:
        type: integer
      description: 每页条数（默认 30，clamp 1-200）
  responses:
    Error:
      description: 统一错误响应（code 与状态码对应关系见 Error schema）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, forbidden, not_found, conflict, too_many_requests, internal_error]
            message:
              type: string
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        is_admin:
          type: boolean
        date_joined:
          type: string
          description: RFC3339（仅 /auth/me 返回）
    AuthStatus:
      type: object
      properties:
        authenticated:
          type: boolean
        username:
          type: string
          nullable: true
        needs_setup:
          type: boolean
        enable_oidc:
          type: boolean
        enable_auth_proxy:
          type: boolean
        disable_login_form:
          type: boolean
    SetupRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          description: 至少 8 位
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          description: 至少 8 位
    TokenInfo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_at:
          type: string
        last_used_at:
          type: string
          nullable: true
        revoked_at:
          type: string
          nullable: true
    CreateTokenRequest:
      type: object
      properties:
        name:
          type: string
          description: Token 名称（可选）
    CreatedToken:
      type: object
      properties:
        id:
          type: integer
          format: int64
        token:
          type: string
          description: 明文 token（lk_ 前缀），仅创建时返回一次
    Bookmark:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        url:
          type: string
        title:
          type: string
        description:
          type: string
        notes:
          type: string
        is_unread:
          type: boolean
        is_archived:
          type: boolean
        is_shared:
          type: boolean
        archive_url:
          type: string
          nullable: true
        created_at:
          type: string
          description: RFC3339
        updated_at:
          type: string
          description: RFC3339
    BookmarkWithTags:
      allOf:
        - $ref: '#/components/schemas/Bookmark'
        - type: object
          properties:
            has_snapshot:
              type: boolean
              description: 列表响应携带；单书签响应不含
            has_preview_image:
              type: boolean
            tags:
              type: array
              items:
                type: string
    BookmarkList:
      type: object
      properties:
        count:
          type: integer
          description: 本页结果数
        total:
          type: integer
          description: 匹配总数
        page:
          type: integer
        per_page:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BookmarkWithTags'
    BookmarkPreviewList:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BookmarkWithTags'
    NewBookmark:
      type: object
      required: [url]
      properties:
        url:
          type: string
        title:
