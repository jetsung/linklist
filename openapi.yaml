openapi: 3.0.3
info:
  title: LinkList API
  description: |
    LinkList REST API：用 Rust 重写的自托管书签管理服务（单二进制，支持
    SQLite / PostgreSQL / MySQL）。

    - 基础路径 `/api/v1`；feed、health、manifest 等端点位于根路径。
    - 认证方式：会话 Cookie（Web 界面登录后自动携带）或 API Token
      （`Authorization: Token <token>`，也可用 `Bearer <token>`）。
    - 统一错误结构：`{"error": {"code": "...", "message": "..."}}`；
      `code` 稳定可编程处理，取值 `bad_request` / `unauthorized` / `forbidden` /
      `not_found` / `conflict` / `too_many_requests` / `internal_error`，
      对应 400 / 401 / 403 / 404 / 409 / 429 / 500。
  version: 0.1.0
servers:
  - url: /
    description: 当前部署实例（相对路径）
tags:
  - name: auth
    description: 认证、会话与 API Token
  - name: bookmarks
    description: 书签 CRUD、检查、导入导出
  - name: tags
    description: 标签管理
  - name: bulk
    description: 书签批量操作
  - name: capture
    description: 页面抓取（元数据/快照/存档查询）
  - name: assets
    description: 书签资产上传与下载
  - name: bundles
    description: Bundle（保存的过滤器）
  - name: profile
    description: 用户偏好与自动打标规则
  - name: shared
    description: 共享书签视图
  - name: admin
    description: 管理端（用户/数据/任务/设置/审计）
  - name: feed
    description: RSS 订阅源
  - name: system
    description: 系统端点（版本/健康检查/manifest/OpenSearch）
security:
  - cookieAuth: []
  - tokenAuth: []
paths:
  /api/v1/auth/status:
    get:
      tags: [auth]
      summary: 认证状态
      description: 匿名可访问。返回当前认证状态与站点能力开关（登录页判定用）。
      operationId: getAuthStatus
      security: []
      responses:
        '200':
          description: 认证状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
  /api/v1/auth/setup:
    post:
      tags: [auth]
      summary: 初始化首个管理员
      description: 仅当库中无用户时可用（已有用户返回 409）；成功后写入会话自动登录。服务端配置 `admin_password` 时优先于请求中的口令。
      operationId: setupAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 口令登录
      description: 成功写入会话 Cookie。纯 SSO 部署（`disable_login_form`）返回 403；登录限速触发返回 429。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 退出登录
      description: 使当前会话失效；匿名调用也返回 200。
      operationId: logout
      responses:
        '200':
          description: 已退出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 当前用户信息
      operationId: getMe
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: 修改口令
      description: 需认证；新口令至少 8 位，旧口令校验失败返回 400。
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/tokens:
    get:
      tags: [auth]
      summary: API Token 列表
      operationId: listTokens
      responses:
        '200':
          description: Token 列表（不含明文）
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenInfo'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [auth]
      summary: 创建 API Token
      description: 明文 token 仅在本次响应中返回一次；有效期由 token_ttl_days 配置控制（0=永久）。
      operationId: createToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedToken'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/tokens/{id}:
    delete:
      tags: [auth]
      summary: 吊销 API Token
      description: 仅能吊销本人 Token；非本人/已吊销/不存在返回 404。
      operationId: revokeToken
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 已吊销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/Error'
  /oidc/login:
    get:
      tags: [auth]
      summary: OIDC 登录入口
      description: 重定向到 IdP 授权页（授权码流程 + PKCE S256）。未启用 OIDC 返回 404。
      operationId: oidcLogin
      security: []
      responses:
        '303':
          description: 重定向到 IdP 授权 URL
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /oidc/callback:
    get:
      tags: [auth]
      summary: OIDC 回调
      description: IdP 认证后回跳；校验通过自动建号（首次）并写会话，重定向回首页。
      operationId: oidcCallback
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
          description: 授权码
        - name: state
          in: query
          schema:
            type: string
          description: 防 CSRF 状态值
        - name: error
          in: query
          schema:
            type: string
          description: IdP 侧错误码
      responses:
        '303':
          description: 校验通过，重定向回首页
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks:
    get:
      tags: [bookmarks]
      summary: 书签列表
      description: 支持表达式搜索、标签/状态筛选与分页。count 为本页结果数，total 为匹配总数。
      operationId: listBookmarks
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [unread, archived, all]
          description: 状态筛选（默认未读优先的活跃书签）
        - name: tag
          in: query
          schema:
            type: string
          description: 标签筛选（AND 语义）
        - name: tags_any
          in: query
          schema:
            type: string
          description: 逗号分隔的 OR 标签（如 tags_any=rust,web）
        - name: q
          in: query
          schema:
            type: string
          description: 搜索表达式（tag:rust、is:unread、AND/OR/NOT 等）
        - name: sort
          in: query
          schema:
            type: string
            enum: [added_asc, added_desc, modified_asc, modified_desc, title_asc, title_desc]
          description: 排序（兼容旧值 created/updated/title）
        - name: shared
          in: query
          schema:
            type: string
            enum: [yes, no]
          description: 共享状态筛选
        - name: unread
          in: query
          schema:
            type: string
            enum: [yes, no]
          description: 未读状态筛选
        - name: bundle
          in: query
          schema:
            type: integer
            format: int64
          description: 应用保存的 Bundle 过滤器（可被显式参数覆盖）
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
          description: 页码（默认 1）
        - name: per_page
          in: query
          schema:
            type: integer
          description: 每页条数（默认取偏好 items_per_page 或 30，上限 200）
        - name: modified_since
          in: query
          schema:
            type: string
            format: date-time
          description: 仅返回 updated_at 晚于该 RFC3339 时间的书签
        - name: added_since
          in: query
          schema:
            type: string
            format: date-time
          description: 仅返回 created_at 晚于该 RFC3339 时间的书签
      responses:
        '200':
          description: 书签分页列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookmarkWithTags'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [bookmarks]
      summary: 创建书签
      description: 创建后自动入队元数据/快照/存档查询/预览图任务；同用户规范化 URL 重复返回 409。
      operationId: createBookmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBookmark'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkWithTags'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/check:
    get:
      tags: [bookmarks]
      summary: URL 检查
      description: 返回同 URL 已存在书签、页面元数据抓取结果与自动打标预览（添加书签前防重复）。
      operationId: checkUrl
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
        - name: ignore_cache
          in: query
          schema:
            type: string
          description: '"true" 时跳过元数据 LRU 缓存'
      responses:
        '200':
          description: 检查结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/{id}:
    get:
      tags: [bookmarks]
      summary: 书签详情
      operationId: getBookmark
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
      responses:
        '200':
          description: 书签对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkWithTags'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [bookmarks]
      summary: 更新书签
      description: 字段可选，未提供的字段不修改；URL 变更会作废旧预览图并入队 preview/archive_lookup 任务。
      operationId: updateBookmark
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookmark'
      responses:
        '200':
          description: 更新后的书签
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkWithTags'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [bookmarks]
      summary: 删除书签
      operationId: deleteBookmark
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/{id}/tags:
    put:
      tags: [bookmarks]
      summary: 整体替换书签标签
      operationId: setBookmarkTags
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTagsRequest'
      responses:
        '200':
          description: 替换后的标签列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetTagsResponse'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/{id}/archive:
    post:
      tags: [bookmarks]
      summary: 归档书签
      operationId: archiveBookmark
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
      responses:
        '200':
          description: 归档后的书签对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/{id}/unarchive:
    post:
      tags: [bookmarks]
      summary: 取消归档
      operationId: unarchiveBookmark
      parameters:
        - $ref: '#/components/parameters/BookmarkId'
      responses:
        '200':
          description: 书签对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/import:
    post:
      tags: [bookmarks]
      summary: 导入 Netscape 书签
      description: 请求体为原始 Netscape HTML 文本（非 multipart）；逐条解析入库，重复 URL 计入 duplicates。
      operationId: importBookmarks
      parameters:
        - name: map_private_flag
          in: query
          schema:
            type: string
            enum: ["true", "on"]
          description: 启用 PRIVATE="0" → 共享 映射
      requestBody:
        required: true
        content:
          text/html:
            schema:
              type: string
      responses:
        '200':
          description: 导入统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStats'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/export:
    get:
      tags: [bookmarks]
      summary: 导出 Netscape 书签
      description: '返回 Netscape HTML 文件（Content-Disposition: attachment）。'
      operationId: exportBookmarks
      responses:
        '200':
          description: Netscape HTML 文件
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/tags:
    get:
      tags: [tags]
      summary: 标签列表（含使用计数）
      description: 复用书签列表查询参数（q/filter/tag/tags_any/bundle 等），带搜索条件时返回过滤结果书签使用的标签。排序：英文在前，中文按拼音。
      operationId: listTags
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: filter
          in: query
          schema:
            type: string
            enum: [unread, archived, all]
        - name: tag
          in: query
          schema:
            type: string
        - name: tags_any
          in: query
          schema:
            type: string
        - name: bundle
          in: query
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
        - name: modified_since
          in: query
          schema:
            type: string
            format: date-time
        - name: added_since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/TagWithCount'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [tags]
      summary: 创建标签（幂等）
      description: 大小写不敏感；已存在时返回已有标签。
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: 标签对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/tags/merge:
    post:
      tags: [tags]
      summary: 合并标签
      description: 把 sources 中的标签合并进 target；target 不得包含于 sources（大小写不敏感）。
      operationId: mergeTags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, sources]
              properties:
                target:
                  type: string
                sources:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: 合并成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/tags/complete:
    get:
      tags: [tags]
      summary: 标签自动补全
      operationId: completeTags
      parameters:
        - name: prefix
          in: query
          schema:
            type: string
          description: 前缀（默认空串）
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: 按使用次数排序的标签列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/TagWithCount'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/tags/{name}:
    get:
      tags: [tags]
      summary: 标签详情
      description: 大小写不敏感匹配。
      operationId: getTag
      parameters:
        - $ref: '#/components/parameters/TagName'
      responses:
        '200':
          description: 标签对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [tags]
      summary: 重命名标签
      operationId: renameTag
      parameters:
        - $ref: '#/components/parameters/TagName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: 新标签名
      responses:
        '200':
          description: 重命名成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [tags]
      summary: 删除标签
      operationId: deleteTag
      parameters:
        - $ref: '#/components/parameters/TagName'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/bulk/tags/add:
    post:
      tags: [bulk]
      summary: 批量加标签
      operationId: bulkAddTags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTagsRequest'
      responses:
        '200':
          description: 逐项结果汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/bulk/tags/remove:
    post:
      tags: [bulk]
      summary: 批量移除标签
      operationId: bulkRemoveTags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTagsRequest'
      responses:
        '200':
          description: 逐项结果汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/bulk/mark-read:
    post:
      tags: [bulk]
      summary: 批量标记已读
      operationId: bulkMarkRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkIdsRequest'
      responses:
        '200':
          description: 逐项结果汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '401':
          $ref: '#/components/responses/Error'
