  /api/v1/bookmarks/bulk/snapshot:
    post:
      tags: [bulk]
      summary: 批量创建 HTML 快照
      description: 逐个入队 snapshot 任务；需启用 enable_snapshots 且后台任务未禁用，否则 400。
      operationId: bulkSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkIdsRequest'
      responses:
        '200':
          description: 逐项结果汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
